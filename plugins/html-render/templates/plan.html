<!--
  plan.html — narrative template for plans, designs, explanations, walkthroughs.

  Layout: a two-column "shell" — a sticky left sidebar (auto-generated table of
  contents + scroll-spy) and a paper article column of long-form prose.

  Core palette / fonts / reset come from /_assets/base.css (warm editorial,
  light-only): Bricolage Grotesque (display), Hanken Grotesk (body),
  JetBrains Mono (code); deep-green accent.

  Placeholders (double-curly, no spaces inside):
    TITLE      — page title (also the document <title>)
    KICKER     — 1-3 word uppercase topic label for the sidebar (e.g. "PP · vLLM")
    SUBTITLE   — one-line summary → rendered as the lede and the sidebar sub
    TIMESTAMP  — ISO timestamp (footer)
    TAGS       — zero or more <span class="tag">word</span> chips, or ""
    PROMPT     — <div class="prompt">…</div> eliciting prompt, or ""
    HERO       — intro: usually a <div class="callout callout--who">…</div> and/or
                 1-2 lead paragraphs
    SECTIONS   — the body: repeated section blocks (see below)

  Section structure (the TOC is built automatically from these <h2 id>):
    <h2 id="sec-1"><span class="secnum">1</span>Section title</h2>
    <p>…prose… with <code class="inline">code</code>, <strong>bold</strong>,
       <em>italic</em>, <a href="…">links</a>.</p>
    <h3 id="sub-a">Sub-heading</h3>           (optional; figure heads: class="fig-head")

  Reusable blocks the agent may emit inside SECTIONS / HERO:
    Callouts:  <div class="callout callout--who|--repro|--warn">
                 <span class="callout__label">Label</span><p>…</p></div>
    Code:      <pre class="code"><code class="language-python">…</code></pre>
               (use class="code ascii" for hand-drawn ASCII; it won't be highlighted)
    Inline:    <code class="inline">x</code>
    Figure:    <div class="figure"><div class="mermaid">…mermaid source…</div></div>
    Table:     <div class="tablewrap"><table><thead>…</thead><tbody>…</tbody></table></div>
                 cell helpers: th.center, td.center, span.yes / span.no

  Anti-slop: no Inter/Roboto/Arial, no purple/violet/cyan accents, no gradient
  text, no emoji icons in <h2>/<h3>, no three-dot window chrome on code.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!-- palette / fonts / reset -->
<link rel="stylesheet" href="/_assets/base.css">
<!-- syntax highlighting (only affects pre.code code blocks) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-light.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<style>
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:17px;
    line-height:1.72;
    -webkit-font-smoothing:antialiased;
  }
  :root{ --max:780px; --fig-max:1080px; }

  /* ---------- shell ---------- */
  .shell{ display:grid; grid-template-columns:268px minmax(0,1fr); max-width:1480px; margin:0 auto; }
  .toc{
    position:sticky; top:0; align-self:start; height:100vh; overflow-y:auto;
    padding:38px 22px 40px 30px; border-right:1px solid var(--border);
    background:linear-gradient(180deg,#fbfaf7,#f5f4f0);
  }
  .toc__brand{
    font-family:var(--display); font-weight:700; font-size:.74rem; letter-spacing:.16em;
    text-transform:uppercase; color:var(--accent); margin:0 0 4px;
  }
  .toc__sub{ font-size:.78rem; color:var(--text-dim); margin:0 0 22px; line-height:1.4; }
  .toc nav{ display:flex; flex-direction:column; gap:1px; }
  .toc a{
    display:flex; gap:8px; text-decoration:none; color:var(--text-soft); font-size:.86rem;
    padding:6px 10px; border-radius:7px; border-left:2px solid transparent;
    transition:background .15s,color .15s,border-color .15s;
  }
  .toc a:hover{ background:#eef0eb; color:var(--text); }
  .toc a.active{ background:var(--accent-soft); color:var(--accent); border-left-color:var(--accent); font-weight:600; }
  .toc a .num{ font-family:var(--mono); font-size:.72rem; color:var(--text-dim); flex:0 0 auto; }
  .toc a.active .num{ color:var(--accent); }

  .main{ min-width:0; }
  .article{ background:var(--surface); min-height:100vh; padding:64px clamp(24px,5vw,80px) 120px; }
  .prose{ max-width:var(--max); margin:0 auto; }

  /* ---------- header ---------- */
  .tags{ display:flex; flex-wrap:wrap; gap:7px; margin:0 auto 22px; max-width:var(--max); }
  .tag{
    font-family:var(--mono); font-size:.68rem; letter-spacing:.06em; text-transform:uppercase;
    color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent-line);
    padding:3px 9px; border-radius:999px;
  }
  h1.title{
    font-family:var(--display); font-weight:700; font-size:clamp(2.1rem,4.4vw,3.05rem);
    line-height:1.07; letter-spacing:-.018em; margin:0 auto 18px; max-width:var(--max);
  }
  .lede{
    max-width:var(--max); margin:0 auto 6px; font-size:1.18rem; line-height:1.55;
    color:var(--text-soft); border-left:3px solid var(--accent-line); padding-left:18px;
  }
  .prompt{
    max-width:var(--max); margin:1.4rem auto 0; padding:.6rem .9rem;
    border-left:3px solid var(--accent); background:var(--accent-soft); color:var(--text-soft);
    font-size:.85rem; line-height:1.5; border-radius:0 6px 6px 0;
  }
  .prompt b{ color:var(--text); font-weight:600; margin-right:.4rem; }

  /* ---------- prose ---------- */
  .prose h2{
    font-family:var(--display); font-weight:700; font-size:1.72rem; letter-spacing:-.01em;
    margin:3.2em 0 .55em; padding-bottom:.28em; border-bottom:1px solid var(--border); scroll-margin-top:24px;
  }
  .prose h2 .secnum{ font-family:var(--mono); font-size:1.05rem; color:var(--accent); margin-right:.5em; font-weight:600; }
  .prose h3{ font-family:var(--display); font-weight:600; font-size:1.22rem; margin:2.2em 0 .4em; color:var(--text); scroll-margin-top:24px; }
  .prose h3.fig-head{ color:var(--accent); display:flex; align-items:baseline; gap:.5em; }
  .prose h3.fig-head .figtag{
    font-family:var(--mono); font-size:.66rem; letter-spacing:.1em; text-transform:uppercase;
    background:var(--accent-soft); border:1px solid var(--accent-line); color:var(--accent);
    padding:2px 8px; border-radius:5px; position:relative; top:-2px;
  }
  .prose p{ margin:1.05em 0; }
  .prose a{ color:var(--accent); text-decoration:none; border-bottom:1px solid var(--accent-line); }
  .prose a:hover{ border-bottom-color:var(--accent); }
  .prose strong{ font-weight:700; color:var(--text); }
  .prose em{ font-style:italic; }
  .prose ul,.prose ol{ margin:1.05em 0; padding-left:1.35em; }
  .prose li{ margin:.5em 0; }
  .prose li::marker{ color:var(--accent); }

  code.inline{
    font-family:var(--mono); font-size:.86em; background:var(--code-bg); border:1px solid var(--border-soft);
    border-radius:5px; padding:1px 6px; color:#3a4256; white-space:nowrap;
  }
  pre.code{
    margin:1.5em 0; background:var(--code-bg); border:1px solid var(--border); border-radius:11px;
    overflow:auto; font-size:.85rem; line-height:1.62;
  }
  pre.code code{ font-family:var(--mono); display:block; padding:20px 22px; background:transparent; }
  pre.code.ascii code{ color:#41485c; }
  .hljs{ background:transparent !important; padding:0 !important; }

  /* ---------- callouts ---------- */
  .callout{ margin:1.7em 0; border-radius:12px; padding:18px 22px 16px 20px; border:1px solid var(--border); background:#fbfaf7; }
  .callout p{ margin:.4em 0; }
  .callout p:first-child{ margin-top:0; } .callout p:last-child{ margin-bottom:0; }
  .callout__label{ font-family:var(--mono); font-size:.66rem; letter-spacing:.13em; text-transform:uppercase; font-weight:600; margin-bottom:6px; display:block; }
  .callout--who{ background:linear-gradient(135deg,#eef5f0,#f6f9f6); border-color:var(--accent-line); border-left:4px solid var(--accent); }
  .callout--who .callout__label{ color:var(--accent); }
  .callout--repro{ background:var(--blue-soft); border-color:var(--blue-line); border-left:4px solid var(--blue); font-size:.93rem; }
  .callout--repro .callout__label{ color:var(--blue); }
  .callout--warn{ background:var(--amber-soft); border-color:var(--amber-line); border-left:4px solid var(--amber); }
  .callout--warn .callout__label{ color:var(--amber); }

  /* ---------- figures ---------- */
  .figure{ margin:1.8em calc(-1 * clamp(0px,2vw,40px)); background:#fcfcfb; border:1px solid var(--border); border-radius:14px; padding:14px 10px 8px; text-align:center; }
  .figure .mermaid{ display:flex; justify-content:center; overflow-x:auto; padding:6px 4px; }
  .figure .mermaid svg{ max-width:100%; height:auto; }
  @media(min-width:1180px){ .figure{ margin-left:calc((var(--max) - var(--fig-max)) / 2); margin-right:calc((var(--max) - var(--fig-max)) / 2); } }

  /* ---------- tables ---------- */
  .tablewrap{ margin:1.6em calc(-1 * clamp(0px,1.5vw,26px)); overflow-x:auto; border:1px solid var(--border); border-radius:12px; }
  table{ border-collapse:collapse; width:100%; font-size:.9rem; background:var(--surface); }
  thead th{ background:#2c3242; color:#f4f5f8; font-weight:600; text-align:left; padding:11px 15px; letter-spacing:.01em; white-space:nowrap; }
  thead th.center{ text-align:center; }
  tbody td{ padding:10px 15px; border-bottom:1px solid var(--border-soft); vertical-align:top; color:var(--text-soft); }
  tbody tr:nth-child(even){ background:#faf9f6; }
  tbody tr:hover{ background:var(--accent-soft); }
  tbody tr:last-child td{ border-bottom:none; }
  tbody td strong{ color:var(--text); }
  td.center{ text-align:center; white-space:nowrap; }
  .yes{ color:var(--red); font-weight:700; } .no{ color:var(--accent); font-weight:700; }
  table code{ font-family:var(--mono); font-size:.82em; background:var(--code-bg); border:1px solid var(--border-soft); border-radius:4px; padding:1px 5px; color:#3a4256; }

  .foot{ max-width:var(--max); margin:60px auto 0; border-top:1px solid var(--border); padding-top:18px; font-size:.8rem; color:var(--text-dim); font-family:var(--mono); }

  @media(max-width:1000px){ .shell{ grid-template-columns:1fr; } .toc{ display:none; } }
</style>
</head>
<body>
<div class="shell">

  <aside class="toc">
    <p class="toc__brand">{{KICKER}}</p>
    <p class="toc__sub">{{SUBTITLE}}</p>
    <nav id="toc-nav"></nav>
  </aside>

  <main class="main">
  <article class="article">

    <div class="tags">{{TAGS}}</div>

    <h1 class="title">{{TITLE}}</h1>

    <p class="lede">{{SUBTITLE}}</p>

    {{PROMPT}}

    <div class="prose">

      {{HERO}}

      {{SECTIONS}}

      <div class="foot">{{TIMESTAMP}}</div>

    </div><!-- /prose -->
  </article>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  // Mermaid (only acts if .mermaid blocks exist) — themed to the page palette.
  try {
    mermaid.initialize({
      startOnLoad:true, theme:'base',
      themeVariables:{
        fontFamily:'Hanken Grotesk, sans-serif',
        primaryColor:'#eef5f0', primaryBorderColor:'#bcd9c8', primaryTextColor:'#1d2230',
        lineColor:'#6b7385', secondaryColor:'#e6eff7', tertiaryColor:'#fbf2dd',
        noteBkgColor:'#fbf2dd', noteBorderColor:'#ecd9a8',
        actorBkg:'#eef5f0', actorBorder:'#2f6d4f', actorTextColor:'#1d2230',
        signalColor:'#4a5165', signalTextColor:'#1d2230'
      },
      flowchart:{ htmlLabels:true, curve:'basis', useMaxWidth:true },
      sequence:{ useMaxWidth:true, wrap:true, mirrorActors:false }
    });
  } catch (e) {}

  // Syntax highlighting (skip ascii + mermaid).
  document.querySelectorAll('pre.code code.language-python, pre.code code.language-bash, pre.code code.language-javascript, pre.code code.language-json, pre.code code.language-yaml').forEach(function(el){
    if (window.hljs) try { hljs.highlightElement(el); } catch (e) {}
  });

  // Build the sidebar TOC from the section headings, then scroll-spy.
  (function(){
    var nav = document.getElementById('toc-nav');
    if (!nav) return;
    var heads = Array.prototype.slice.call(document.querySelectorAll('.prose h2[id]'));
    var map = {};
    heads.forEach(function(h){
      var a = document.createElement('a');
      a.href = '#' + h.id;
      var numEl = h.querySelector('.secnum');
      var num = numEl ? numEl.textContent.trim() : '§';
      var label = (numEl ? h.textContent.replace(numEl.textContent, '') : h.textContent).trim();
      a.innerHTML = '<span class="num">' + num + '</span><span>' + label + '</span>';
      nav.appendChild(a);
      map[h.id] = a;
    });
    function onScroll(){
      var top = window.scrollY + 120, current = null;
      heads.forEach(function(h){ if (h.offsetTop <= top) current = h.id; });
      heads.forEach(function(h){ if (map[h.id]) map[h.id].classList.remove('active'); });
      if (current && map[current]) map[current].classList.add('active');
    }
    window.addEventListener('scroll', onScroll, {passive:true});
    onScroll();
  })();
</script>
</body>
</html>
